<section class="employees-page">
  <h1>Employees</h1>

  <table class="employees-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Department</th>
      </tr>
    </thead>
    <tbody>
      @for (employee of employees(); track employee.id) {
        <tr>
          <td>{{ employee.name }}</td>
          <td>{{ employee.role }}</td>
          <td>{{ employee.department }}</td>
        </tr>
      }
    </tbody>
  </table>
</section>
