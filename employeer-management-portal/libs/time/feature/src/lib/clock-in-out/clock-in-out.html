<lib-card title="Clock in / out">
  <div class="status">
    <span class="dot" [class.on]="clock().clockedIn"></span>
    @if (clock().clockedIn) {
      <span>Clocked in since <strong>{{ sinceLabel() }}</strong></span>
    } @else {
      <span>Not clocked in</span>
    }
  </div>

  <lib-button [variant]="clock().clockedIn ? 'secondary' : 'primary'" (click)="toggle()">
    {{ clock().clockedIn ? 'Clock out' : 'Clock in' }}
  </lib-button>
</lib-card>
