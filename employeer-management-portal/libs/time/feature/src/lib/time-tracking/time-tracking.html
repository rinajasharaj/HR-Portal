<section class="time-tracking-page">
  <h1>Time Tracking</h1>

  <table class="time-tracking-table">
    <thead>
      <tr>
        <th>Day</th>
        <th>Hours</th>
      </tr>
    </thead>
    <tbody>
      @for (entry of dailyHours(); track entry.day) {
        <tr>
          <td>{{ entry.day }}</td>
          <td>{{ entry.hours }}</td>
        </tr>
      }
    </tbody>
  </table>
</section>
