<lib-card title="Weekly timesheet">
  <lib-table [columns]="columns" [totalItems]="week().length" [pageSize]="7">
    @for (entry of week(); track entry.day) {
      <tr>
        <td class="day">{{ entry.day }}</td>
        <td class="hours-cell">
          <lib-input
            [value]="entry.hours.toString()"
            (valueChange)="onHours(entry.day, $event)"
          />
        </td>
      </tr>
    }
  </lib-table>

  <div class="total">
    <span>Weekly total</span>
    <span class="total-value">{{ total() }} h</span>
  </div>
</lib-card>
