<div class="layout">
  <aside class="sidebar">
    <div class="brand">HR Portal</div>

    @for (item of navItems(); track item.route) {
      <a
        tuiButton
        [appearance]="'flat'"
        [size]="'s'"
        iconStart="@tui.chevron-right"
        [routerLink]="item.route"
        routerLinkActive="nav-active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      >
        <span class="sidebar-item">{{ item.label }}</span>
      </a>
    }

    <div class="role-switch">
      <div class="role-label">
        {{ user.userName() }} · {{ user.role() }}
      </div>
      <button
        tuiButton
        [appearance]="'secondary'"
        [size]="'s'"
        (click)="user.toggleRole()"
      >
        Switch to {{ user.isManager() ? 'employee' : 'manager' }}
      </button>
    </div>
  </aside>

  <main class="content">
    <tui-breadcrumbs class="breadcrumb">
      @for (crumb of breadcrumbs(); track crumb) {
        <a *tuiItem>{{ crumb }}</a>
      }
    </tui-breadcrumbs>

    <router-outlet />
  </main>
</div>
